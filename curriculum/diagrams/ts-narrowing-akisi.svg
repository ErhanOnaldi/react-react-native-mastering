<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320">
  <title>TypeScript narrowing kontrol akışı</title>
  <defs>
    <marker id="ok-narrowing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="ok-narrowing-dogru" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="d-accent" x="35" y="118" width="150" height="70" rx="8"/>
  <text class="d-title" x="110" y="145" text-anchor="middle">Başlangıç</text>
  <text class="d-code" x="110" y="169" text-anchor="middle">string | null</text>

  <rect class="d-box" x="250" y="55" width="170" height="70" rx="8"/>
  <text class="d-title" x="335" y="82" text-anchor="middle">path === null?</text>
  <text class="d-muted" x="335" y="106" text-anchor="middle">kontrol akışı</text>

  <rect class="d-warning" x="535" y="45" width="170" height="70" rx="8"/>
  <text class="d-title" x="620" y="72" text-anchor="middle">null dalı</text>
  <text class="d-code" x="620" y="96" text-anchor="middle">"Poster yok"</text>

  <rect class="d-success" x="535" y="180" width="170" height="70" rx="8"/>
  <text class="d-title" x="620" y="207" text-anchor="middle">else sonrası</text>
  <text class="d-code" x="620" y="231" text-anchor="middle">path: string</text>

  <line class="d-line" x1="185" y1="153" x2="245" y2="96" marker-end="url(#ok-narrowing)"/>
  <line class="d-line" x1="420" y1="90" x2="531" y2="80" marker-end="url(#ok-narrowing)"/>
  <text class="d-muted" x="475" y="73" text-anchor="middle">evet</text>
  <path class="d-line-accent" d="M420 100 C470 125 480 202 531 214" marker-end="url(#ok-narrowing-dogru)"/>
  <text class="d-muted" x="445" y="205" text-anchor="middle">hayır</text>

  <rect class="d-lane" x="75" y="270" width="610" height="32" rx="8"/>
  <text class="d-text" x="380" y="292" text-anchor="middle">Her dalda union küçülür; TypeScript kalan olasılığı bilir.</text>
</svg>
