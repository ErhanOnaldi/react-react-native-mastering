<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360">
  <title>Render tetikleyicileri ve memo sınırları</title>
  <defs>
    <marker id="ok-render-neden" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="ok-render-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-danger" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="d-accent" x="300" y="140" width="160" height="74" rx="8"/>
  <text class="d-title" x="380" y="168" text-anchor="middle">Bileşen</text>
  <text class="d-text" x="380" y="192" text-anchor="middle">render edilir</text>

  <rect class="d-box" x="55" y="45" width="150" height="56" rx="8"/>
  <text class="d-title" x="130" y="68" text-anchor="middle">Kendi state</text>
  <text class="d-code" x="130" y="88" text-anchor="middle">setState</text>

  <rect class="d-box" x="555" y="45" width="150" height="56" rx="8"/>
  <text class="d-title" x="630" y="68" text-anchor="middle">Üst render</text>
  <text class="d-text" x="630" y="88" text-anchor="middle">çocuk çağrılır</text>

  <rect class="d-violet" x="55" y="260" width="150" height="56" rx="8"/>
  <text class="d-title" x="130" y="283" text-anchor="middle">Context</text>
  <text class="d-text" x="130" y="303" text-anchor="middle">okunan değer</text>

  <rect class="d-warning" x="555" y="260" width="150" height="56" rx="8"/>
  <text class="d-title" x="630" y="283" text-anchor="middle">Yeni key</text>
  <text class="d-text" x="630" y="303" text-anchor="middle">instance değişir</text>

  <line class="d-line" x1="205" y1="95" x2="296" y2="145" marker-end="url(#ok-render-neden)"/>
  <line class="d-line" x1="555" y1="95" x2="464" y2="145" marker-end="url(#ok-render-neden)"/>
  <line class="d-line" x1="205" y1="275" x2="296" y2="207" marker-end="url(#ok-render-neden)"/>
  <line class="d-line" x1="555" y1="275" x2="464" y2="207" marker-end="url(#ok-render-neden)"/>

  <rect class="d-success" x="290" y="25" width="180" height="50" rx="8"/>
  <text class="d-title" x="380" y="46" text-anchor="middle">memo sınırı</text>
  <text class="d-muted" x="380" y="65" text-anchor="middle">aynı props ise durur</text>
  <path class="d-line-danger d-dashed" d="M555 73 H474" marker-end="url(#ok-render-stop)"/>

  <text class="d-muted" x="380" y="342" text-anchor="middle">memo context değişimini ya da yeni key ile reset'i durdurmaz.</text>
</svg>
