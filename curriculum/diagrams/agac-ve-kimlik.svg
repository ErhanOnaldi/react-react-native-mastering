<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390">
  <title>Bileşen ağacı, konum ve key kimliği</title>
  <defs>
    <marker id="ok-kimlik" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="ok-kimlik-kirmizi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-danger" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <text class="d-title" x="190" y="32" text-anchor="middle">Render A</text>
  <text class="d-title" x="570" y="32" text-anchor="middle">Render B</text>

  <rect class="d-box" x="115" y="55" width="150" height="42" rx="8"/>
  <text class="d-text" x="190" y="82" text-anchor="middle">App</text>
  <rect class="d-box" x="80" y="130" width="120" height="42" rx="8"/>
  <text class="d-text" x="140" y="157" text-anchor="middle">Liste</text>
  <rect class="d-accent" x="220" y="130" width="120" height="42" rx="8"/>
  <text class="d-text" x="280" y="157" text-anchor="middle">Kart key=550</text>
  <rect class="d-success" x="220" y="205" width="120" height="50" rx="8"/>
  <text class="d-text" x="280" y="227" text-anchor="middle">Input</text>
  <text class="d-muted" x="280" y="247" text-anchor="middle">state: not</text>

  <line class="d-line" x1="190" y1="97" x2="140" y2="126"/>
  <line class="d-line" x1="190" y1="97" x2="280" y2="126"/>
  <line class="d-line" x1="280" y1="172" x2="280" y2="201"/>

  <rect class="d-box" x="495" y="55" width="150" height="42" rx="8"/>
  <text class="d-text" x="570" y="82" text-anchor="middle">App</text>
  <rect class="d-box" x="460" y="130" width="120" height="42" rx="8"/>
  <text class="d-text" x="520" y="157" text-anchor="middle">Liste</text>
  <rect class="d-accent" x="600" y="130" width="120" height="42" rx="8"/>
  <text class="d-text" x="660" y="157" text-anchor="middle">Kart key=550</text>
  <rect class="d-success" x="600" y="205" width="120" height="50" rx="8"/>
  <text class="d-text" x="660" y="227" text-anchor="middle">Input</text>
  <text class="d-muted" x="660" y="247" text-anchor="middle">state korunur</text>

  <line class="d-line" x1="570" y1="97" x2="520" y2="126"/>
  <line class="d-line" x1="570" y1="97" x2="660" y2="126"/>
  <line class="d-line" x1="660" y1="172" x2="660" y2="201"/>
  <line class="d-line-accent d-dashed" x1="340" y1="230" x2="596" y2="230" marker-end="url(#ok-kimlik)"/>
  <text class="d-text-success" x="470" y="216" text-anchor="middle">aynı konum + aynı key</text>

  <rect class="d-danger" x="95" y="300" width="250" height="54" rx="8"/>
  <text class="d-title" x="220" y="322" text-anchor="middle">Farklı key ya da konum</text>
  <text class="d-text" x="220" y="344" text-anchor="middle">eski state sıfırlanır</text>
  <path class="d-line-danger d-dashed" d="M380 327 H475" marker-end="url(#ok-kimlik-kirmizi)"/>
  <rect class="d-box" x="515" y="300" width="150" height="54" rx="8"/>
  <text class="d-text" x="590" y="322" text-anchor="middle">Yeni instance</text>
  <text class="d-muted" x="590" y="344" text-anchor="middle">boş state</text>
</svg>
