<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330">
  <title>URL state ve nested route ağacı</title>
  <defs>
    <marker id="ok-url" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="ok-url-vurgu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="d-accent" x="65" y="45" width="630" height="48" rx="8"/>
  <text class="d-code" x="380" y="75" text-anchor="middle">/search?q=matrix&amp;page=2</text>
  <text class="d-muted" x="380" y="30" text-anchor="middle">URL paylaşılabilir ve geri tuşuyla gezilebilir tek kaynaktır</text>

  <rect class="d-box" x="70" y="155" width="150" height="56" rx="8"/>
  <text class="d-title" x="145" y="178" text-anchor="middle">Root route</text>
  <text class="d-text" x="145" y="198" text-anchor="middle">Layout</text>

  <rect class="d-box" x="305" y="155" width="150" height="56" rx="8"/>
  <text class="d-title" x="380" y="178" text-anchor="middle">Outlet</text>
  <text class="d-text" x="380" y="198" text-anchor="middle">çocuk yerleşir</text>

  <rect class="d-success" x="540" y="155" width="150" height="56" rx="8"/>
  <text class="d-title" x="615" y="178" text-anchor="middle">SearchPage</text>
  <text class="d-code" x="615" y="198" text-anchor="middle">useSearchParams</text>

  <line class="d-line" x1="220" y1="183" x2="301" y2="183" marker-end="url(#ok-url)"/>
  <line class="d-line" x1="455" y1="183" x2="536" y2="183" marker-end="url(#ok-url)"/>
  <path class="d-line-accent" d="M380 93 V151" marker-end="url(#ok-url-vurgu)"/>

  <rect class="d-lane" x="150" y="255" width="460" height="42" rx="8"/>
  <text class="d-text" x="380" y="282" text-anchor="middle">Input URL'yi okur; değişiklik adresi günceller.</text>
</svg>
