<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330">
  <title>React Hook Form form state modeli</title>
  <defs>
    <marker id="ok-form" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="ok-form-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="d-box" x="50" y="65" width="170" height="68" rx="8"/>
  <text class="d-title" x="135" y="92" text-anchor="middle">Input alanları</text>
  <text class="d-code" x="135" y="116" text-anchor="middle">register('name')</text>

  <rect class="d-accent" x="295" y="55" width="170" height="88" rx="8"/>
  <text class="d-title" x="380" y="83" text-anchor="middle">RHF deposu</text>
  <text class="d-text" x="380" y="108" text-anchor="middle">değerler ve hatalar</text>
  <text class="d-muted" x="380" y="130" text-anchor="middle">React state kopyası değil</text>

  <rect class="d-success" x="540" y="65" width="170" height="68" rx="8"/>
  <text class="d-title" x="625" y="92" text-anchor="middle">Abone UI</text>
  <text class="d-code" x="625" y="116" text-anchor="middle">formState / watch</text>

  <line class="d-line" x1="220" y1="99" x2="291" y2="99" marker-end="url(#ok-form)"/>
  <line class="d-line-accent" x1="465" y1="99" x2="536" y2="99" marker-end="url(#ok-form-accent)"/>

  <rect class="d-violet" x="260" y="220" width="240" height="58" rx="8"/>
  <text class="d-title" x="380" y="243" text-anchor="middle">handleSubmit</text>
  <text class="d-text" x="380" y="265" text-anchor="middle">geçerli values verir</text>
  <path class="d-line" d="M380 143 V216" marker-end="url(#ok-form)"/>

  <text class="d-muted" x="380" y="308" text-anchor="middle">Yalnız abone olunan parça render tetikler.</text>
</svg>
