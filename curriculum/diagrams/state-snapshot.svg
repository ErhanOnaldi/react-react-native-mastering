<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355">
  <title>State snapshot ve updater kuyruğu</title>
  <defs>
    <marker id="ok-snapshot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="ok-snapshot-dogru" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="d-accent" x="35" y="42" width="145" height="88" rx="8"/>
  <text class="d-title" x="108" y="73" text-anchor="middle">Render 1</text>
  <text class="d-code" x="108" y="101" text-anchor="middle">count = 0</text>

  <rect class="d-warning" x="230" y="24" width="250" height="128" rx="8"/>
  <text class="d-title" x="355" y="52" text-anchor="middle">Aynı handler</text>
  <text class="d-code" x="355" y="78" text-anchor="middle">setCount(count + 1)</text>
  <text class="d-code" x="355" y="100" text-anchor="middle">setCount(count + 1)</text>
  <text class="d-code" x="355" y="122" text-anchor="middle">setCount(count + 1)</text>

  <rect class="d-danger" x="550" y="42" width="165" height="88" rx="8"/>
  <text class="d-title" x="633" y="73" text-anchor="middle">Render 2</text>
  <text class="d-code" x="633" y="101" text-anchor="middle">count = 1</text>

  <line class="d-line" x1="180" y1="86" x2="226" y2="86" marker-end="url(#ok-snapshot)"/>
  <line class="d-line" x1="480" y1="86" x2="546" y2="86" marker-end="url(#ok-snapshot)"/>
  <text class="d-muted" x="380" y="181" text-anchor="middle">Üç çağrının her biri 0 + 1 hesaplar; sonuç 1 olur.</text>

  <rect class="d-lane" x="35" y="205" width="680" height="105" rx="10"/>
  <text class="d-title" x="380" y="233" text-anchor="middle">Updater kuyruğu aynı işi sırayla yapar</text>

  <rect class="d-success" x="75" y="254" width="95" height="34" rx="8"/>
  <text class="d-code" x="123" y="276" text-anchor="middle">0</text>
  <rect class="d-success" x="235" y="254" width="95" height="34" rx="8"/>
  <text class="d-code" x="283" y="276" text-anchor="middle">n + 1</text>
  <rect class="d-success" x="395" y="254" width="95" height="34" rx="8"/>
  <text class="d-code" x="443" y="276" text-anchor="middle">n + 1</text>
  <rect class="d-success" x="555" y="254" width="95" height="34" rx="8"/>
  <text class="d-code" x="603" y="276" text-anchor="middle">n + 1</text>

  <line class="d-line-accent" x1="170" y1="271" x2="231" y2="271" marker-end="url(#ok-snapshot-dogru)"/>
  <line class="d-line-accent" x1="330" y1="271" x2="391" y2="271" marker-end="url(#ok-snapshot-dogru)"/>
  <line class="d-line-accent" x1="490" y1="271" x2="551" y2="271" marker-end="url(#ok-snapshot-dogru)"/>
  <text class="d-text-success" x="380" y="335" text-anchor="middle">Sonuç: 3</text>
</svg>
