  <path class="d-line-accent" d="M350 101 C275 140 200 160 155 186" marker-end="url(#ok-context)"/>
  <path class="d-line-accent" d="M410 101 C485 140 560 160 605 186" marker-end="url(#ok-context)"/>
  <line class="d-line d-dashed" x1="380" y1="101" x2="380" y2="186"/>

  <text class="d-text" x="380" y="316" text-anchor="middle">Context veri taşır; cache ya da kalıcılık sağlamaz.</text>
