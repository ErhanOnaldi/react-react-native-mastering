  <rect class="d-success" x="80" y="190" width="150" height="60" rx="8"/>
  <text class="d-title" x="155" y="214" text-anchor="middle">Tüketici A</text>
  <text class="d-text" x="155" y="236" text-anchor="middle">render olur</text>

  <rect class="d-box" x="305" y="190" width="150" height="60" rx="8"/>
  <text class="d-title" x="380" y="214" text-anchor="middle">Ara bileşen</text>
  <text class="d-muted" x="380" y="236" text-anchor="middle">okumaz</text>

  <rect class="d-success" x="530" y="190" width="150" height="60" rx="8"/>
  <text class="d-title" x="605" y="214" text-anchor="middle">Tüketici B</text>
