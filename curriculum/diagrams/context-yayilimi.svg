      <path class="d-arrowhead-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="d-accent" x="280" y="35" width="200" height="66" rx="8"/>
  <text class="d-title" x="380" y="62" text-anchor="middle">Provider</text>
  <text class="d-code" x="380" y="84" text-anchor="middle">value değişti</text>

  <rect class="d-lane" x="45" y="130" width="670" height="155" rx="10"/>
