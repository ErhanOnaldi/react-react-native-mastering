  <path class="d-line" d="M320 107 C255 145 205 160 170 186" marker-end="url(#ok-veri)"/>
  <path class="d-line" d="M440 107 C505 145 555 160 590 186" marker-end="url(#ok-veri)"/>
  <text class="d-muted" x="290" y="181" text-anchor="middle">props aşağı</text>
