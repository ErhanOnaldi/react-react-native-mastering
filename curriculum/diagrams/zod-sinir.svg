<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310">
  <title>Zod sınırı: unknown veriden tipli veriye</title>
  <defs>
    <marker id="ok-zod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="ok-zod-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-danger" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="d-violet" x="45" y="80" width="170" height="72" rx="8"/>
  <text class="d-title" x="130" y="108" text-anchor="middle">Sınır</text>
  <text class="d-code" x="130" y="132" text-anchor="middle">unknown</text>

  <rect class="d-accent" x="295" y="80" width="170" height="72" rx="8"/>
  <text class="d-title" x="380" y="108" text-anchor="middle">schema.parse</text>
  <text class="d-text" x="380" y="132" text-anchor="middle">çalışma zamanı</text>

  <rect class="d-success" x="545" y="45" width="170" height="62" rx="8"/>
  <text class="d-title" x="630" y="70" text-anchor="middle">Tipli veri</text>
  <text class="d-code" x="630" y="92" text-anchor="middle">MovieDetails</text>

  <rect class="d-danger" x="545" y="155" width="170" height="62" rx="8"/>
  <text class="d-title" x="630" y="180" text-anchor="middle">Hata</text>
  <text class="d-text" x="630" y="202" text-anchor="middle">kullanma, göster</text>

  <line class="d-line" x1="215" y1="116" x2="291" y2="116" marker-end="url(#ok-zod)"/>
  <path class="d-line" d="M465 104 C495 88 515 78 541 76" marker-end="url(#ok-zod)"/>
  <path class="d-line-danger" d="M465 128 C495 150 515 183 541 186" marker-end="url(#ok-zod-danger)"/>

  <rect class="d-lane" x="100" y="255" width="560" height="32" rx="8"/>
  <text class="d-text" x="380" y="277" text-anchor="middle">API, form ve env sınırlarında aynı fikir geçerlidir.</text>
</svg>
