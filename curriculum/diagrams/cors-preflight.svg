<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300">
  <title>CORS preflight sırası</title>
  <defs>
    <marker id="ok-cors" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="ok-cors-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <text class="d-muted" x="380" y="30" text-anchor="middle">Authorization ya da JSON POST gibi isteklerde tarayıcı önce izin sorar</text>

  <rect class="d-accent" x="45" y="70" width="150" height="56" rx="8"/>
  <text class="d-title" x="120" y="93" text-anchor="middle">Tarayıcı</text>
  <text class="d-code" x="120" y="113" text-anchor="middle">Origin A</text>

  <rect class="d-violet" x="565" y="70" width="150" height="56" rx="8"/>
  <text class="d-title" x="640" y="93" text-anchor="middle">API</text>
  <text class="d-code" x="640" y="113" text-anchor="middle">Origin B</text>

  <line class="d-line" x1="195" y1="95" x2="561" y2="95" marker-end="url(#ok-cors)"/>
  <text class="d-code" x="380" y="84" text-anchor="middle">OPTIONS + Access-Control-Request-*</text>

  <line class="d-line-accent" x1="565" y1="154" x2="199" y2="154" marker-end="url(#ok-cors-accent)"/>
  <text class="d-code" x="380" y="144" text-anchor="middle">Allow-Origin / Methods / Headers</text>

  <line class="d-line" x1="195" y1="215" x2="561" y2="215" marker-end="url(#ok-cors)"/>
  <text class="d-code" x="380" y="204" text-anchor="middle">asıl istek: POST / Authorization</text>

  <rect class="d-success" x="240" y="245" width="280" height="34" rx="8"/>
  <text class="d-text" x="380" y="267" text-anchor="middle">İzin yoksa cevap JavaScript'e açılmaz.</text>
</svg>
