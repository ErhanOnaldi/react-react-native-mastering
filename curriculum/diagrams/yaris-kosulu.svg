<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475">
  <title>Yarış koşulu: Matrix cevabını geç gelen Dövüş Kulübü cevabı ezer</title>
  <defs>
    <marker id="ok-yaris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="ok-yaris-kirmizi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-danger" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <text class="d-muted" x="380" y="28" text-anchor="middle">İstekler farklı sırada biter; zaman soldan sağa akar.</text>
  <line class="d-line" x1="70" y1="60" x2="705" y2="60" marker-end="url(#ok-yaris)"/>

  <text class="d-title" x="105" y="111" text-anchor="middle">İstek A</text>
  <text class="d-text" x="105" y="132" text-anchor="middle">“Dövüş”</text>
  <text class="d-muted" x="206" y="109" text-anchor="middle">erken başlar</text>
  <text class="d-muted" x="646" y="109" text-anchor="middle">geç biter</text>
  <line class="d-line-danger" x1="165" y1="140" x2="645" y2="140" marker-end="url(#ok-yaris-kirmizi)"/>

  <text class="d-title" x="105" y="184" text-anchor="middle">İstek B</text>
  <text class="d-text" x="105" y="205" text-anchor="middle">“Matrix”</text>
  <text class="d-muted" x="307" y="184" text-anchor="middle">sonra başlar</text>
  <text class="d-muted" x="490" y="184" text-anchor="middle">erken biter</text>
  <line class="d-line-accent" x1="295" y1="215" x2="490" y2="215" marker-end="url(#ok-yaris)"/>

  <line class="d-line" x1="490" y1="219" x2="490" y2="265" marker-end="url(#ok-yaris)"/>
  <line class="d-line-danger" x1="645" y1="144" x2="645" y2="265" marker-end="url(#ok-yaris-kirmizi)"/>

  <rect class="d-success" x="350" y="270" width="175" height="65" rx="8"/>
  <text class="d-title" x="437" y="295" text-anchor="middle">B bitince ekran</text>
  <text class="d-text" x="437" y="319" text-anchor="middle">Matrix</text>

  <rect class="d-danger" x="545" y="270" width="190" height="65" rx="8"/>
  <text class="d-title" x="640" y="295" text-anchor="middle">A geç bitince ekran</text>
  <text class="d-text" x="640" y="319" text-anchor="middle">Dövüş Kulübü</text>

  <text class="d-text-danger" x="640" y="365" text-anchor="middle">eski cevap yeniyi ezdi</text>

  <rect class="d-success" x="80" y="393" width="600" height="63" rx="8"/>
  <text class="d-title" x="380" y="419" text-anchor="middle">cleanup: eski çalışmanın yazma hakkını kaldır</text>
  <text class="d-text" x="380" y="442" text-anchor="middle">ignore bayrağı / AbortController</text>
</svg>
