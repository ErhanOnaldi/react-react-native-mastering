<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220">
  <title>Uzak verinin dört ayrı durumu ve yalnız başarı ile hatanın kendi alanlarını taşıması</title>
  <rect class="d-box" x="12" y="65" width="170" height="112" rx="12" />
  <text class="d-title" x="97" y="98" text-anchor="middle">idle</text>
  <text class="d-code" x="97" y="128" text-anchor="middle">status: 'idle'</text>
  <text class="d-muted" x="97" y="151" text-anchor="middle">ek payload yok</text>
  <rect class="d-accent" x="202" y="65" width="170" height="112" rx="12" />
  <text class="d-title" x="287" y="98" text-anchor="middle">loading</text>
  <text class="d-code" x="287" y="128" text-anchor="middle">status: 'loading'</text>
  <text class="d-muted" x="287" y="151" text-anchor="middle">ek payload yok</text>
  <rect class="d-success" x="392" y="65" width="170" height="112" rx="12" />
  <text class="d-title" x="477" y="98" text-anchor="middle">success</text>
  <text class="d-code" x="477" y="128" text-anchor="middle">data: T</text>
  <text class="d-muted" x="477" y="151" text-anchor="middle">yalnız başarı verisi</text>
  <rect class="d-danger" x="582" y="65" width="166" height="112" rx="12" />
  <text class="d-title" x="665" y="98" text-anchor="middle">error</text>
  <text class="d-code" x="665" y="128" text-anchor="middle">error: string</text>
  <text class="d-muted" x="665" y="151" text-anchor="middle">yalnız hata mesajı</text>
  <text class="d-muted" x="380" y="202" text-anchor="middle">status switch'i dalları daraltır; never unutulan yeni durumu yakalar.</text>
</svg>
