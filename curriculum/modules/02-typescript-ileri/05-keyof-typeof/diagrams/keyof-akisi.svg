<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230">
  <title>Nesne tipinden anahtar unionı ve indeksli erişimle alan değer tipi çıkarma</title>
  <defs>
    <marker id="keyof-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path class="d-arrowhead-accent" d="M0 0 L8 4 L0 8 Z" />
    </marker>
  </defs>
  <rect class="d-box" x="25" y="70" width="205" height="105" rx="12" />
  <text class="d-title" x="127.5" y="101" text-anchor="middle">Kaynak tip</text>
  <text class="d-code" x="127.5" y="131" text-anchor="middle">Movie</text>
  <text class="d-muted" x="127.5" y="153" text-anchor="middle">id · title · releaseYear</text>
  <path class="d-line-accent" d="M240 95 C275 95 270 55 310 55" marker-end="url(#keyof-arrow)" />
  <path class="d-line-accent" d="M240 150 C275 150 270 188 310 188" marker-end="url(#keyof-arrow)" />
  <rect class="d-accent" x="318" y="24" width="190" height="75" rx="12" />
  <text class="d-title" x="413" y="54" text-anchor="middle">Anahtar kümesi</text>
  <text class="d-code" x="413" y="79" text-anchor="middle">keyof Movie</text>
  <rect class="d-success" x="318" y="151" width="190" height="75" rx="12" />
  <text class="d-title" x="413" y="181" text-anchor="middle">Seçilen alanın tipi</text>
  <text class="d-code" x="413" y="206" text-anchor="middle">Movie['releaseYear']</text>
  <path class="d-line" d="M518 62 H557" marker-end="url(#keyof-arrow)" />
  <path class="d-line" d="M518 188 H557" marker-end="url(#keyof-arrow)" />
  <rect class="d-violet" x="565" y="24" width="170" height="75" rx="12" />
  <text class="d-title" x="650" y="54" text-anchor="middle">İsimler</text>
  <text class="d-code" x="650" y="79" text-anchor="middle">'id' | 'title' | …</text>
  <rect class="d-violet" x="565" y="151" width="170" height="75" rx="12" />
  <text class="d-title" x="650" y="181" text-anchor="middle">Değer tipi</text>
  <text class="d-code" x="650" y="206" text-anchor="middle">number</text>
</svg>
