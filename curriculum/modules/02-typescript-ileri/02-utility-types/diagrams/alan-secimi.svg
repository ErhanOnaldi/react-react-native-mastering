<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380">
  <title>Movie tipinden Pick, Omit ve Partial ile türetilen üç tipin alanları</title>
  <defs>
    <marker id="alan-ok" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0 0 L8 4 L0 8 Z" />
    </marker>
  </defs>

  <rect class="d-box" x="16" y="80" width="236" height="220" rx="12" />
  <text class="d-title" x="134" y="112" text-anchor="middle">Movie (kaynak)</text>
  <text class="d-code" x="134" y="146" text-anchor="middle">id: number</text>
  <text class="d-code" x="134" y="168" text-anchor="middle">title: string</text>
  <text class="d-code" x="134" y="190" text-anchor="middle">poster_path: string | null</text>
  <text class="d-code" x="134" y="212" text-anchor="middle">release_date: string</text>
  <text class="d-code" x="134" y="234" text-anchor="middle">vote_average: number</text>
  <text class="d-muted" x="134" y="270" text-anchor="middle">… ve 9 alan daha</text>

  <path class="d-line-accent" d="M256 170 L318 68" marker-end="url(#alan-ok)" />
  <path class="d-line-accent" d="M256 190 H318" marker-end="url(#alan-ok)" />
  <path class="d-line-accent" d="M256 210 L318 312" marker-end="url(#alan-ok)" />

  <rect class="d-accent" x="324" y="16" width="420" height="104" rx="12" />
  <text class="d-code" x="534" y="44" text-anchor="middle">Pick&lt;Movie, 'id' | 'title'&gt;</text>
  <text class="d-code" x="534" y="72" text-anchor="middle">{ id: number; title: string }</text>
  <text class="d-muted" x="534" y="100" text-anchor="middle">yalnızca seçilen iki alan</text>

  <rect class="d-warning" x="324" y="138" width="420" height="104" rx="12" />
  <text class="d-code" x="534" y="166" text-anchor="middle">Omit&lt;Movie, 'id'&gt;</text>
  <text class="d-code" x="534" y="194" text-anchor="middle">{ title; poster_path; release_date; … }</text>
  <text class="d-muted" x="534" y="222" text-anchor="middle">id hariç hepsi, tipleri aynen</text>

  <rect class="d-success" x="324" y="260" width="420" height="104" rx="12" />
  <text class="d-code" x="534" y="288" text-anchor="middle">Partial&lt;Movie&gt;</text>
  <text class="d-code" x="534" y="316" text-anchor="middle">{ id?; title?; poster_path?; … }</text>
  <text class="d-muted" x="534" y="344" text-anchor="middle">hepsi var, ama hiçbiri zorunlu değil</text>
</svg>
