<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230">
  <title>Props çağırandan bileşene tipli sözleşmeyle akar</title>
  <defs>
    <marker id="props-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="d-box" x="20" y="60" width="210" height="112" rx="10"/>
  <text class="d-title" x="125" y="88" text-anchor="middle">Çağıran ekran</text>
  <text class="d-code" x="125" y="116" text-anchor="middle">title: string</text>
  <text class="d-code" x="125" y="138" text-anchor="middle">visual: ReactNode</text>
  <text class="d-code" x="125" y="160" text-anchor="middle">onSelect(id)</text>

  <rect class="d-accent" x="275" y="60" width="210" height="112" rx="10"/>
  <text class="d-title" x="380" y="88" text-anchor="middle">Props tipi</text>
  <text class="d-text" x="380" y="116" text-anchor="middle">çağrıyı denetler</text>
  <text class="d-muted" x="380" y="140" text-anchor="middle">eksik / yanlış tür → hata</text>
  <text class="d-muted" x="380" y="160" text-anchor="middle">derleme anında</text>

  <rect class="d-success" x="530" y="60" width="210" height="112" rx="10"/>
  <text class="d-title" x="635" y="88" text-anchor="middle">Bileşen</text>
  <text class="d-code" x="635" y="116" text-anchor="middle">props → JSX</text>
  <text class="d-text" x="635" y="140" text-anchor="middle">içeriği render eder</text>
  <text class="d-text" x="635" y="160" text-anchor="middle">olayı callback'e verir</text>

  <line class="d-line" x1="230" y1="116" x2="271" y2="116" marker-end="url(#props-ok)"/>
  <line class="d-line" x1="485" y1="116" x2="526" y2="116" marker-end="url(#props-ok)"/>
  <text class="d-muted" x="380" y="205" text-anchor="middle">Tipler çağrıları denetler; çalışma anında veriyi dönüştürmez.</text>
</svg>
