<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300">
  <title>Status discriminant'i idle, loading, error ve success görünümünü seçer</title>
  <defs>
    <marker id="durum-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="d-accent" x="285" y="25" width="190" height="62" rx="9"/>
  <text class="d-title" x="380" y="51" text-anchor="middle">state.status</text>
  <text class="d-muted" x="380" y="73" text-anchor="middle">union'ı daraltır</text>

  <line class="d-line" x1="380" y1="87" x2="380" y2="116"/>
  <line class="d-line" x1="85" y1="116" x2="655" y2="116"/>
  <line class="d-line" x1="85" y1="116" x2="85" y2="148" marker-end="url(#durum-ok)"/>
  <line class="d-line" x1="275" y1="116" x2="275" y2="148" marker-end="url(#durum-ok)"/>
  <line class="d-line" x1="465" y1="116" x2="465" y2="148" marker-end="url(#durum-ok)"/>
  <line class="d-line" x1="655" y1="116" x2="655" y2="148" marker-end="url(#durum-ok)"/>

  <rect class="d-box" x="10" y="155" width="150" height="92" rx="8"/>
  <text class="d-title" x="85" y="183" text-anchor="middle">idle</text>
  <text class="d-text" x="85" y="210" text-anchor="middle">arama mesajı</text>
  <text class="d-muted" x="85" y="232" text-anchor="middle">veri alanı yok</text>

  <rect class="d-warning" x="200" y="155" width="150" height="92" rx="8"/>
  <text class="d-title" x="275" y="183" text-anchor="middle">loading</text>
  <text class="d-text" x="275" y="210" text-anchor="middle">yükleniyor</text>
  <text class="d-muted" x="275" y="232" text-anchor="middle">veri alanı yok</text>

  <rect class="d-danger" x="390" y="155" width="150" height="92" rx="8"/>
  <text class="d-title" x="465" y="183" text-anchor="middle">error</text>
  <text class="d-text" x="465" y="210" text-anchor="middle">message</text>
  <text class="d-muted" x="465" y="232" text-anchor="middle">hata açıklaması</text>

  <rect class="d-success" x="580" y="155" width="150" height="92" rx="8"/>
  <text class="d-title" x="655" y="183" text-anchor="middle">success</text>
  <text class="d-text" x="655" y="210" text-anchor="middle">items</text>
  <text class="d-muted" x="655" y="232" text-anchor="middle">boş / dolu</text>

  <text class="d-muted" x="380" y="282" text-anchor="middle">Her dal yalnız o duruma ait alanı ve arayüzü kullanır.</text>
</svg>
