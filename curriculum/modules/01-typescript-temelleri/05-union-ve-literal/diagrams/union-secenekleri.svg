<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220">
  <title>Union farklı değer seçeneklerini birleştirir</title>
  <rect x="25" y="40" width="210" height="130" rx="12" class="d-box" />
  <text x="130" y="75" text-anchor="middle" class="d-title">string | null</text>
  <text x="130" y="111" text-anchor="middle" class="d-code">'poster.jpg'</text>
  <text x="130" y="145" text-anchor="middle" class="d-code">null</text>
  <rect x="275" y="40" width="210" height="130" rx="12" class="d-accent" />
  <text x="380" y="75" text-anchor="middle" class="d-title">union</text>
  <text x="380" y="111" text-anchor="middle" class="d-text">bir değer</text>
  <text x="380" y="145" text-anchor="middle" class="d-muted">alternatiflerden biri</text>
  <rect x="525" y="40" width="210" height="130" rx="12" class="d-success" />
  <text x="630" y="75" text-anchor="middle" class="d-title">literal union</text>
  <text x="630" y="111" text-anchor="middle" class="d-code">'grid' | 'list'</text>
  <text x="630" y="145" text-anchor="middle" class="d-muted">kapalı seçenek kümesi</text>
</svg>
