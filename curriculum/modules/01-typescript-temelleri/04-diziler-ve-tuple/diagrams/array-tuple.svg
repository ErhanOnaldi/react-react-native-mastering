<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210">
  <title>Dizi ve tuple uzunluk sözleşmesi</title>
  <defs>
    <marker id="array-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" class="d-arrowhead" />
    </marker>
  </defs>
  <rect x="25" y="35" width="330" height="135" rx="12" class="d-accent" />
  <text x="190" y="67" text-anchor="middle" class="d-title">Dizi: Performer[]</text>
  <text x="190" y="101" text-anchor="middle" class="d-code">[P, P, P, …]</text>
  <text x="190" y="137" text-anchor="middle" class="d-muted">Uzunluk değişir · eleman tipi aynı</text>
  <rect x="405" y="35" width="330" height="135" rx="12" class="d-success" />
  <text x="570" y="67" text-anchor="middle" class="d-title">Tuple: [string, number]</text>
  <text x="570" y="101" text-anchor="middle" class="d-code">[başlık, saniye]</text>
  <text x="570" y="137" text-anchor="middle" class="d-muted">İki konum · sıra ve tip sabit</text>
</svg>
