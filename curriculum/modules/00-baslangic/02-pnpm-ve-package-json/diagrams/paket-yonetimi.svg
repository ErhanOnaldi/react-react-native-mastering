<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260">
  <title>pnpm paket çözümleme ve lockfile zihinsel modeli</title>
  <defs>
    <marker id="pkg-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Kutu 1: package.json -->
  <rect class="d-box" x="25" y="40" width="155" height="180" rx="8"/>
  <text class="d-title" x="102" y="70" text-anchor="middle">package.json</text>
  <text class="d-text" x="102" y="105" text-anchor="middle">İstek Listesi</text>
  <text class="d-code" x="102" y="135" text-anchor="middle">^19.3.0</text>
  <text class="d-muted" x="102" y="170" text-anchor="middle">Esnek aralıklar</text>

  <!-- Kutu 2: lockfile -->
  <rect class="d-accent" x="210" y="40" width="165" height="180" rx="8"/>
  <text class="d-title" x="292" y="70" text-anchor="middle">pnpm-lock.yaml</text>
  <text class="d-text" x="292" y="105" text-anchor="middle">Kesin Sürüm</text>
  <text class="d-code" x="292" y="135" text-anchor="middle">19.3.2</text>
  <text class="d-muted" x="292" y="170" text-anchor="middle">Herkes aynı kopyada</text>

  <!-- Kutu 3: Global Store -->
  <rect class="d-violet" x="405" y="40" width="155" height="180" rx="8"/>
  <text class="d-title" x="482" y="70" text-anchor="middle">pnpm Store</text>
  <text class="d-text" x="482" y="105" text-anchor="middle">Global Depo</text>
  <text class="d-muted" x="482" y="135" text-anchor="middle">Diskte tek kopya</text>
  <text class="d-text" x="482" y="170" text-anchor="middle">Hızlı ve tasarruflu</text>

  <!-- Kutu 4: node_modules -->
  <rect class="d-success" x="590" y="40" width="145" height="180" rx="8"/>
  <text class="d-title" x="662" y="70" text-anchor="middle">node_modules</text>
  <text class="d-text" x="662" y="105" text-anchor="middle">Proje Alanı</text>
  <text class="d-code" x="662" y="135" text-anchor="middle">Hard linkler</text>
  <text class="d-muted" x="662" y="170" text-anchor="middle">Sadece izinliler</text>

  <!-- Oklar -->
  <line class="d-line" x1="180" y1="130" x2="206" y2="130" marker-end="url(#pkg-ok)"/>
  <line class="d-line" x1="375" y1="130" x2="401" y2="130" marker-end="url(#pkg-ok)"/>
  <line class="d-line" x1="560" y1="130" x2="586" y2="130" marker-end="url(#pkg-ok)"/>
</svg>
