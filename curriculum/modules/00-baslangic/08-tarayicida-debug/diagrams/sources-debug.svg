<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280">
  <title>Sources panelinde adım adım hata ayıklama</title>
  <defs>
    <marker id="dbg-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Sol Kutu: Kod ve Breakpoint -->
  <rect class="d-box" x="25" y="35" width="235" height="215" rx="8"/>
  <text class="d-title" x="142" y="65" text-anchor="middle">Kod ve Breakpoint</text>
  <text class="d-code" x="40" y="100">12 | const base = 100;</text>
  <text class="d-code" x="40" y="125">13 | const disc = 20;</text>
  <circle cx="34" cy="146" r="5" class="d-arrowhead-danger"/>
  <text class="d-code d-text-danger" x="44" y="150">14 | return base + disc;</text>
  <text class="d-text" x="142" y="195" text-anchor="middle">Satır 14'te duraklatıldı</text>
  <text class="d-muted" x="142" y="222" text-anchor="middle">debugger; veya satıra tıkla</text>

  <!-- Orta Kutu: Yürütme Kontrolü -->
  <rect class="d-accent" x="290" y="70" width="165" height="145" rx="8"/>
  <text class="d-title" x="372" y="100" text-anchor="middle">Yürütme Kontrolü</text>
  <text class="d-text" x="372" y="130" text-anchor="middle">F8: Devam et</text>
  <text class="d-text" x="372" y="158" text-anchor="middle">F10: Adım atla</text>
  <text class="d-muted" x="372" y="186" text-anchor="middle">F11: İçine gir</text>

  <!-- Sağ Üst Kutu: Scope -->
  <rect class="d-warning" x="485" y="35" width="250" height="98" rx="8"/>
  <text class="d-title" x="610" y="65" text-anchor="middle">Scope (Değişkenler)</text>
  <text class="d-code" x="505" y="94">base: 100</text>
  <text class="d-code" x="505" y="117">disc: 20</text>

  <!-- Sağ Alt Kutu: Call Stack -->
  <rect class="d-violet" x="485" y="152" width="250" height="98" rx="8"/>
  <text class="d-title" x="610" y="182" text-anchor="middle">Call Stack (Zincir)</text>
  <text class="d-code" x="505" y="211">▶ calculateTotal() [14]</text>
  <text class="d-code" x="505" y="234">  handleCheckout() [42]</text>

  <!-- Bağlantı Çizgileri -->
  <line class="d-line" x1="260" y1="142" x2="286" y2="142" marker-end="url(#dbg-ok)"/>
  <line class="d-line" x1="455" y1="115" x2="481" y2="84" marker-end="url(#dbg-ok)"/>
  <line class="d-line" x1="455" y1="170" x2="481" y2="201" marker-end="url(#dbg-ok)"/>
</svg>
