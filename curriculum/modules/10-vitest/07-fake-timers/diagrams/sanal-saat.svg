<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240">
  <title>Atla işareti callback'i 2400 milisaniyede çalışır</title>
  <defs>
    <marker id="timer-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" class="d-arrowhead" />
    </marker>
  </defs>
  <text x="85" y="42" text-anchor="middle" class="d-title">0 ms</text>
  <text x="570" y="42" text-anchor="middle" class="d-title">2399 ms</text>
  <text x="680" y="42" text-anchor="middle" class="d-title">2400 ms</text>
  <path d="M55 86 L704 86" class="d-line" marker-end="url(#timer-arrow)" />
  <circle cx="85" cy="86" r="8" class="d-accent" />
  <circle cx="570" cy="86" r="8" class="d-danger" />
  <circle cx="680" cy="86" r="8" class="d-success" />
  <rect x="25" y="120" width="210" height="78" rx="10" class="d-accent" />
  <text x="130" y="150" text-anchor="middle" class="d-title">Atla timer’ı kurulur</text>
  <text x="130" y="177" text-anchor="middle" class="d-text">callback 2400 ms sonra</text>
  <rect x="275" y="120" width="210" height="78" rx="10" class="d-warning" />
  <text x="380" y="150" text-anchor="middle" class="d-title">2399 ms</text>
  <text x="380" y="177" text-anchor="middle" class="d-text">callback henüz çalışmadı</text>
  <rect x="525" y="120" width="210" height="78" rx="10" class="d-success" />
  <text x="630" y="150" text-anchor="middle" class="d-title">2400 ms</text>
  <text x="630" y="177" text-anchor="middle" class="d-text">callback bir kez çalıştı</text>
</svg>
