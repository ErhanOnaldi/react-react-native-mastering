<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240">
  <title>Yeni toast gelince eski gizleme timerı iptal edilir</title>
  <defs>
    <marker id="timer-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" class="d-arrowhead" />
    </marker>
  </defs>
  <text x="105" y="42" text-anchor="middle" class="d-title">0 ms</text>
  <text x="330" y="42" text-anchor="middle" class="d-title">2000 ms</text>
  <text x="545" y="42" text-anchor="middle" class="d-title">3000 ms</text>
  <text x="695" y="42" text-anchor="middle" class="d-title">5000 ms</text>
  <path d="M76 86 L704 86" class="d-line" marker-end="url(#timer-arrow)" />
  <circle cx="105" cy="86" r="8" class="d-accent" />
  <circle cx="330" cy="86" r="8" class="d-accent" />
  <circle cx="545" cy="86" r="8" class="d-danger" />
  <circle cx="695" cy="86" r="8" class="d-success" />
  <rect x="33" y="120" width="220" height="78" rx="10" class="d-accent" />
  <text x="143" y="150" text-anchor="middle" class="d-title">“Kaydedildi” toast’ı</text>
  <text x="143" y="177" text-anchor="middle" class="d-text">timer A başlar</text>
  <rect x="265" y="120" width="220" height="78" rx="10" class="d-warning" />
  <text x="375" y="150" text-anchor="middle" class="d-title">“Güncellendi” gelir</text>
  <text x="375" y="177" text-anchor="middle" class="d-text">A temizlenir, B başlar</text>
  <rect x="505" y="120" width="220" height="78" rx="10" class="d-success" />
  <text x="615" y="150" text-anchor="middle" class="d-title">B’nin süresi dolar</text>
  <text x="615" y="177" text-anchor="middle" class="d-text">toast gizlenir</text>
</svg>
