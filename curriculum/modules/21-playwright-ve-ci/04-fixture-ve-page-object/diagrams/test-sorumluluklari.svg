<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230">
  <title>Testte page object ve fixture sorumlulukları</title>
  <defs>
    <marker id="page-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8Z" class="d-arrowhead-accent" />
    </marker>
  </defs>
  <rect x="26" y="65" width="205" height="95" rx="12" class="d-violet" />
  <text x="128" y="98" text-anchor="middle" class="d-title">Fixture</text>
  <text x="128" y="124" text-anchor="middle" class="d-muted">hazırla ve temizle</text>
  <rect x="278" y="65" width="205" height="95" rx="12" class="d-accent" />
  <text x="380" y="98" text-anchor="middle" class="d-title">Page object</text>
  <text x="380" y="124" text-anchor="middle" class="d-muted">locator ve kullanıcı eylemi</text>
  <rect x="530" y="65" width="205" height="95" rx="12" class="d-success" />
  <text x="632" y="98" text-anchor="middle" class="d-title">Test</text>
  <text x="632" y="124" text-anchor="middle" class="d-muted">senaryo ve beklenti</text>
  <path d="M237 112H267" class="d-line-accent" marker-end="url(#page-arrow)" />
  <path d="M489 112H519" class="d-line-accent" marker-end="url(#page-arrow)" />
  <text x="380" y="206" text-anchor="middle" class="d-text">Her katman tek bir nedeni sahiplenir</text>
</svg>
