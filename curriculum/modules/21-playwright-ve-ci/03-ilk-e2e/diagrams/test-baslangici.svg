      <path d="M0 0L8 4L0 8Z" class="d-arrowhead-accent" />
    </marker>
  </defs>
  <rect x="24" y="64" width="205" height="88" rx="12" class="d-accent" />
  <text x="126" y="96" text-anchor="middle" class="d-title">Config okunur</text>
  <text x="126" y="122" text-anchor="middle" class="d-muted">baseURL ve webServer</text>
  <rect x="278" y="64" width="205" height="88" rx="12" class="d-violet" />
  <text x="380" y="96" text-anchor="middle" class="d-title">Sunucu hazır olur</text>
