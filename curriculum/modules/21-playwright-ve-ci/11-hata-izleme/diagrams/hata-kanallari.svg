<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300">
  <title>Tarayıcı ve React hata kanallarının rapora akışı</title>
  <defs>
    <marker id="ok-hata" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="d-accent" x="35" y="35" width="205" height="74" rx="8"/>
  <text class="d-title" x="137" y="64" text-anchor="middle">React kök hataları</text>
  <text class="d-muted" x="137" y="87" text-anchor="middle">caught / uncaught</text>
  <rect class="d-violet" x="35" y="172" width="205" height="74" rx="8"/>
  <text class="d-title" x="137" y="201" text-anchor="middle">Tarayıcı olayları</text>
  <text class="d-muted" x="137" y="224" text-anchor="middle">error / unhandledrejection</text>
  <rect class="d-box" x="315" y="100" width="175" height="82" rx="8"/>
  <text class="d-title" x="402" y="132" text-anchor="middle">Küçük hata kaydı</text>
  <text class="d-muted" x="402" y="158" text-anchor="middle">mesaj + route + release</text>
  <rect class="d-success" x="565" y="100" width="160" height="82" rx="8"/>
  <text class="d-title" x="645" y="132" text-anchor="middle">İzleme servisi</text>
  <text class="d-muted" x="645" y="158" text-anchor="middle">map ile kaynak satır</text>
  <path class="d-line" d="M240 72 L275 72 L275 121 L310 121" marker-end="url(#ok-hata)"/>
  <path class="d-line" d="M240 209 L275 209 L275 161 L310 161" marker-end="url(#ok-hata)"/>
  <line class="d-line" x1="490" y1="141" x2="560" y2="141" marker-end="url(#ok-hata)"/>
</svg>
