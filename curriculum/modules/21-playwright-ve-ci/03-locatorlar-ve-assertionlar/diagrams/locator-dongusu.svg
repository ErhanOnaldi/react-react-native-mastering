<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220">
  <title>Locator ve görünür koşulu bekleme döngüsü</title>
  <defs>
    <marker id="locator-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8Z" class="d-arrowhead-accent" />
    </marker>
  </defs>
  <rect x="28" y="70" width="190" height="78" rx="12" class="d-accent" />
  <text x="123" y="101" text-anchor="middle" class="d-title">Locator tarifi</text>
  <text x="123" y="126" text-anchor="middle" class="d-muted">rol ve erişilebilir ad</text>
  <rect x="285" y="70" width="190" height="78" rx="12" class="d-box" />
  <text x="380" y="101" text-anchor="middle" class="d-title">Eylem</text>
  <text x="380" y="126" text-anchor="middle" class="d-muted">click veya fill</text>
  <rect x="542" y="70" width="190" height="78" rx="12" class="d-success" />
  <text x="637" y="101" text-anchor="middle" class="d-title">Assertion</text>
  <text x="637" y="126" text-anchor="middle" class="d-muted">koşul oluşana dek dene</text>
  <path d="M225 108H275" class="d-line-accent" marker-end="url(#locator-arrow)" />
  <path d="M482 108H532" class="d-line-accent" marker-end="url(#locator-arrow)" />
  <path d="M637 158C637 198 123 198 123 158" class="d-line d-dashed" marker-end="url(#locator-arrow)" />
  <text x="380" y="216" text-anchor="middle" class="d-muted">DOM değişirse locator yeniden çözülür</text>
</svg>
