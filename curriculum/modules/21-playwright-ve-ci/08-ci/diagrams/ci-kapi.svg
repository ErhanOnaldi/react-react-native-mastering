      <path d="M0 0L8 4L0 8Z" class="d-arrowhead-accent" />
    </marker>
  </defs>
  <rect x="8" y="62" width="114" height="76" rx="12" class="d-box" />
  <text x="65" y="94" text-anchor="middle" class="d-title">Kur</text>
  <text x="65" y="118" text-anchor="middle" class="d-muted">lockfile</text>
  <rect x="134" y="62" width="114" height="76" rx="12" class="d-accent" />
  <text x="191" y="94" text-anchor="middle" class="d-title">Lint + tip</text>
  <text x="191" y="118" text-anchor="middle" class="d-muted">hızlı kapılar</text>
  <rect x="260" y="62" width="114" height="76" rx="12" class="d-success" />
  <text x="317" y="94" text-anchor="middle" class="d-title">Vitest</text>
  <text x="317" y="118" text-anchor="middle" class="d-muted">birim testleri</text>
  <rect x="386" y="62" width="114" height="76" rx="12" class="d-accent" />
  <text x="443" y="94" text-anchor="middle" class="d-title">Build</text>
  <text x="443" y="118" text-anchor="middle" class="d-muted">üretim çıktısı</text>
  <rect x="512" y="62" width="114" height="76" rx="12" class="d-violet" />
