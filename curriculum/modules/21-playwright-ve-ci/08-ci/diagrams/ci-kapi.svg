  <path d="M250 100H256" class="d-line-accent" marker-end="url(#ci-arrow)" />
  <path d="M376 100H382" class="d-line-accent" marker-end="url(#ci-arrow)" />
  <path d="M502 100H508" class="d-line-accent" marker-end="url(#ci-arrow)" />
