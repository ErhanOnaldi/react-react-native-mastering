      <path d="M0 0L8 4L0 8Z" class="d-arrowhead-accent" />
    </marker>
  </defs>
  <rect x="18" y="62" width="124" height="76" rx="12" class="d-box" />
  <text x="80" y="94" text-anchor="middle" class="d-title">Kur</text>
  <text x="80" y="118" text-anchor="middle" class="d-muted">lockfile</text>
  <rect x="168" y="62" width="124" height="76" rx="12" class="d-accent" />
  <text x="230" y="94" text-anchor="middle" class="d-title">Lint + tip</text>
  <text x="230" y="118" text-anchor="middle" class="d-muted">hızlı kapılar</text>
  <rect x="318" y="62" width="124" height="76" rx="12" class="d-success" />
