  <path d="M296 100H313" class="d-line-accent" marker-end="url(#ci-arrow)" />
  <path d="M446 100H463" class="d-line-accent" marker-end="url(#ci-arrow)" />
  <path d="M596 100H613" class="d-line-accent" marker-end="url(#ci-arrow)" />
  <text x="380" y="196" text-anchor="middle" class="d-text">Erken ve ucuz hatalar önce görünür</text>
