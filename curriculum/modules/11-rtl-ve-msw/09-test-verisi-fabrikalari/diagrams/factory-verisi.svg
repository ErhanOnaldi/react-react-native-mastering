<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260">
  <title>Varsayılan veri ve kısmi override factory’de birleşir</title>
  <defs>
    <marker id="arrow-factory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <text class="d-muted" x="380" y="28" text-anchor="middle">Her çağrı geçerli, bağımsız test girdisi üretir</text>

  <rect class="d-box" x="35" y="82" width="180" height="76" rx="8"/>
  <text class="d-title" x="125" y="112" text-anchor="middle">Varsayılanlar</text>
  <text class="d-code" x="125" y="137" text-anchor="middle">id · title · genres</text>

  <rect class="d-warning" x="35" y="174" width="180" height="62" rx="8"/>
  <text class="d-title" x="125" y="199" text-anchor="middle">Partial override</text>
  <text class="d-code" x="125" y="221" text-anchor="middle">poster: null</text>

  <rect class="d-accent" x="290" y="112" width="180" height="76" rx="8"/>
  <text class="d-title" x="380" y="142" text-anchor="middle">Factory</text>
  <text class="d-muted" x="380" y="167" text-anchor="middle">override en son</text>

  <rect class="d-success" x="545" y="112" width="180" height="76" rx="8"/>
  <text class="d-title" x="635" y="142" text-anchor="middle">Yeni fixture</text>
  <text class="d-muted" x="635" y="167" text-anchor="middle">tipli ve bağımsız</text>

  <path class="d-line" d="M215 120 C248 120 250 140 286 140" marker-end="url(#arrow-factory)"/>
  <path class="d-line" d="M215 205 C248 205 250 163 286 163" marker-end="url(#arrow-factory)"/>
  <line class="d-line-accent" x1="470" y1="150" x2="541" y2="150" marker-end="url(#arrow-factory)"/>
</svg>
