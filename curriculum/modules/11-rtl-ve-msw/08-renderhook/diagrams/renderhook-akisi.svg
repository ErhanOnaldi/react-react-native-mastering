<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230">
  <title>renderHook ile hook geçişini gözleme</title>
  <defs>
    <marker id="arrow-hook" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <text class="d-muted" x="380" y="28" text-anchor="middle">Hook React render’ında çalışır; act güncellemeyi tamamlar</text>

  <rect class="d-box" x="25" y="82" width="165" height="76" rx="8"/>
  <text class="d-title" x="107" y="112" text-anchor="middle">renderHook</text>
  <text class="d-code" x="107" y="137" text-anchor="middle">() =&gt; useTag()</text>

  <rect class="d-accent" x="210" y="82" width="165" height="76" rx="8"/>
  <text class="d-title" x="292" y="112" text-anchor="middle">result.current</text>
  <text class="d-muted" x="292" y="137" text-anchor="middle">son dönüş değeri</text>

  <rect class="d-violet" x="395" y="82" width="150" height="76" rx="8"/>
  <text class="d-title" x="470" y="112" text-anchor="middle">act(action)</text>
  <text class="d-muted" x="470" y="137" text-anchor="middle">state geçişi</text>

  <rect class="d-success" x="565" y="82" width="170" height="76" rx="8"/>
  <text class="d-title" x="650" y="112" text-anchor="middle">Yeni render</text>
  <text class="d-muted" x="650" y="137" text-anchor="middle">yeni current</text>

  <line class="d-line" x1="190" y1="120" x2="206" y2="120" marker-end="url(#arrow-hook)"/>
  <line class="d-line" x1="375" y1="120" x2="391" y2="120" marker-end="url(#arrow-hook)"/>
  <line class="d-line" x1="545" y1="120" x2="561" y2="120" marker-end="url(#arrow-hook)"/>
</svg>
