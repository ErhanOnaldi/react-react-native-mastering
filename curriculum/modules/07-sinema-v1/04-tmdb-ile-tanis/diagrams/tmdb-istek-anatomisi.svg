<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240">
  <title>TMDB API İstek ve Görsel Akışı</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="d-arrowhead" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="d-arrowhead-accent" />
    </marker>
  </defs>

  <!-- Kutu 1: İstemci Bileşeni -->
  <rect x="20" y="30" width="160" height="170" rx="8" class="d-box" />
  <text x="100" y="60" text-anchor="middle" class="d-title">React Arayüzü</text>
  <text x="100" y="90" text-anchor="middle" class="d-text">Router / URL State</text>
  <text x="100" y="115" text-anchor="middle" class="d-muted">(?q=Matrix&amp;page=1)</text>
  <text x="100" y="145" text-anchor="middle" class="d-text">Yaşam Döngüsü</text>
  <text x="100" y="170" text-anchor="middle" class="d-muted">loading / error / data</text>

  <!-- Ok 1 -> 2 -->
  <path d="M 180 115 L 216 115" class="d-line" marker-end="url(#arrow)" />

  <!-- Kutu 2: İstek Hazırlığı -->
  <rect x="220" y="30" width="220" height="170" rx="8" class="d-accent" />
  <text x="330" y="58" text-anchor="middle" class="d-title">HTTP İstek Sözleşmesi</text>
  <text x="330" y="86" text-anchor="middle" class="d-code">Authorization: Bearer</text>
  <text x="330" y="110" text-anchor="middle" class="d-text">Taban: /3 + URLSearchParams</text>
  <text x="330" y="134" text-anchor="middle" class="d-code">language=tr-TR</text>
  <text x="330" y="162" text-anchor="middle" class="d-text">Hata Kontrolü</text>
  <text x="330" y="184" text-anchor="middle" class="d-muted">!response.ok → Hata Fırlat</text>

  <!-- Ok 2 -> 3 (API) -->
  <path d="M 440 75 L 496 75" class="d-line-accent" marker-end="url(#arrow-accent)" />

  <!-- Ok 2 -> 4 (Görsel) -->
  <path d="M 440 165 L 496 165" class="d-line" marker-end="url(#arrow)" />

  <!-- Kutu 3: TMDB JSON API -->
  <rect x="500" y="30" width="240" height="85" rx="8" class="d-box" />
  <text x="620" y="55" text-anchor="middle" class="d-title">TMDB REST Servisi</text>
  <text x="620" y="78" text-anchor="middle" class="d-code">api.themoviedb.org/3</text>
  <text x="620" y="100" text-anchor="middle" class="d-muted">JSON: results, total_pages</text>

  <!-- Kutu 4: TMDB Görsel CDN -->
  <rect x="500" y="130" width="240" height="85" rx="8" class="d-box" />
  <text x="620" y="155" text-anchor="middle" class="d-title">Görsel Sunucusu (CDN)</text>
  <text x="620" y="178" text-anchor="middle" class="d-code">image.tmdb.org/t/p/w342</text>
  <text x="620" y="200" text-anchor="middle" class="d-muted">poster_path ile birleştirilir</text>
</svg>
