<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320">
  <title>Custom hook sınırı</title>
  <defs>
    <marker id="hook-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="d-lane" x="45" y="40" width="670" height="235" rx="12"/>
  <rect class="d-box" x="75" y="95" width="160" height="80" rx="8"/>
  <text class="d-title" x="155" y="125" text-anchor="middle">Component</text>
  <text class="d-muted" x="155" y="150" text-anchor="middle">UI kararları</text>

  <rect class="d-accent" x="300" y="75" width="160" height="120" rx="8"/>
  <text class="d-title" x="380" y="105" text-anchor="middle">Custom hook</text>
  <text class="d-code" x="380" y="132" text-anchor="middle">useMovieDetails</text>
  <text class="d-muted" x="380" y="157" text-anchor="middle">state + effect</text>

  <rect class="d-violet" x="525" y="95" width="160" height="80" rx="8"/>
  <text class="d-title" x="605" y="125" text-anchor="middle">Dış sistem</text>
  <text class="d-muted" x="605" y="150" text-anchor="middle">film API'si</text>

  <line class="d-line" x1="235" y1="135" x2="296" y2="135" marker-end="url(#hook-ok)"/>
  <line class="d-line" x1="460" y1="135" x2="521" y2="135" marker-end="url(#hook-ok)"/>
  <line class="d-line" x1="300" y1="175" x2="239" y2="175" marker-end="url(#hook-ok)"/>

  <text class="d-text-accent" x="380" y="235" text-anchor="middle">Her çağrı kendi state'ini alır; global cache kendiliğinden oluşmaz</text>
</svg>
