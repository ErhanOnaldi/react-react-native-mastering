<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 245">
  <title>Navigasyon niyetine göre link veya programatik geçiş seçimi</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0,0 L8,4 L0,8 z" />
    </marker>
  </defs>
  <rect class="d-accent" x="230" y="28" width="300" height="70" rx="12" />
  <text class="d-title" x="380" y="57" text-anchor="middle">Kullanıcının niyeti ne?</text>
  <text class="d-muted" x="380" y="81" text-anchor="middle">Bir adrese gitmek mi, işlem tamamlamak mı?</text>
  <rect class="d-success" x="45" y="152" width="280" height="72" rx="12" />
  <text class="d-title" x="185" y="181" text-anchor="middle">Bilinen hedef</text>
  <text class="d-code" x="185" y="205" text-anchor="middle">Link / NavLink</text>
  <rect class="d-violet" x="435" y="152" width="280" height="72" rx="12" />
  <text class="d-title" x="575" y="181" text-anchor="middle">İşlem sonucu</text>
  <text class="d-code" x="575" y="205" text-anchor="middle">useNavigate()</text>
  <path class="d-line-accent" d="M300 105 L200 144" marker-end="url(#arrow)" />
  <path class="d-line-accent" d="M460 105 L560 144" marker-end="url(#arrow)" />
</svg>
