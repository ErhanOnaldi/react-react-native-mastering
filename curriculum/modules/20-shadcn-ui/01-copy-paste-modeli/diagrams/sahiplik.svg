<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190">
  <title>shadcn yapılandırması, CLI, uygulama kaynağı ve runtime paketleri ilişkisi</title>
  <defs>
    <marker id="ownership-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" class="d-arrowhead-accent" />
    </marker>
  </defs>
  <rect x="20" y="58" width="155" height="78" rx="10" class="d-accent" />
  <text x="97" y="88" text-anchor="middle" class="d-title">components.json</text>
  <text x="97" y="112" text-anchor="middle" class="d-muted">alias ve CSS yolu</text>
  <rect x="215" y="58" width="145" height="78" rx="10" class="d-box" />
  <text x="287" y="88" text-anchor="middle" class="d-title">shadcn CLI</text>
  <text x="287" y="112" text-anchor="middle" class="d-muted">kaynak üretir</text>
  <rect x="400" y="58" width="160" height="78" rx="10" class="d-success" />
  <text x="480" y="88" text-anchor="middle" class="d-title">Yerel UI dosyaları</text>
  <text x="480" y="112" text-anchor="middle" class="d-muted">projenin kaynak kodu</text>
  <rect x="600" y="58" width="145" height="78" rx="10" class="d-violet" />
  <text x="672" y="88" text-anchor="middle" class="d-title">Runtime paketleri</text>
  <text x="672" y="112" text-anchor="middle" class="d-muted">manifestte bildirilir</text>
  <path d="M175 97 H208" class="d-line-accent" marker-end="url(#ownership-arrow)" />
  <path d="M360 97 H393" class="d-line-accent" marker-end="url(#ownership-arrow)" />
  <path d="M560 97 H593" class="d-line" marker-end="url(#ownership-arrow)" />
  <text x="380" y="170" text-anchor="middle" class="d-text">Kopyalanan dosya senin; dosyanın import ettiği paket ayrı bağımlılıktır.</text>
</svg>
