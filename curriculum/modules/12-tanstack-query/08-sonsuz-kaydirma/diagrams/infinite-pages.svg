<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250">
  <title>Infinite query sayfa cevaplarını aynı cache girdisinde biriktirir</title>
  <defs>
    <marker id="infinite-page-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="d-box" x="30" y="46" width="195" height="70" rx="8"/>
  <text class="d-title" x="127" y="75" text-anchor="middle">Page 1</text>
  <text class="d-code" x="127" y="99" text-anchor="middle">pageParam: 1</text>
  <rect class="d-warning" x="282" y="46" width="195" height="70" rx="8"/>
  <text class="d-title" x="379" y="75" text-anchor="middle">Page 2</text>
  <text class="d-code" x="379" y="99" text-anchor="middle">pageParam: 2</text>
  <rect class="d-success" x="535" y="46" width="195" height="70" rx="8"/>
  <text class="d-title" x="632" y="75" text-anchor="middle">Page 3</text>
  <text class="d-code" x="632" y="99" text-anchor="middle">pageParam: 3</text>
  <line class="d-line" x1="227" y1="81" x2="277" y2="81" marker-end="url(#infinite-page-arrow)"/>
  <line class="d-line" x1="479" y1="81" x2="530" y2="81" marker-end="url(#infinite-page-arrow)"/>
  <rect class="d-accent" x="105" y="162" width="550" height="56" rx="8"/>
  <text class="d-title" x="380" y="196" text-anchor="middle">Tek cache girdisi: data.pages = [Page 1, Page 2, Page 3]</text>
</svg>
