<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220">
  <title>Class birleştirme ve Tailwind çakışması</title>
  <defs>
    <marker id="merge-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0,0 L8,4 L0,8 z" />
    </marker>
  </defs>
  <rect class="d-danger" x="20" y="48" width="210" height="112" rx="12" />
  <text class="d-title" x="125" y="78" text-anchor="middle">Girdi class'ları</text>
  <text class="d-code" x="125" y="112" text-anchor="middle">p-2 + koşullu class</text>
  <text class="d-code" x="125" y="136" text-anchor="middle">+ p-6 override</text>
  <rect class="d-accent" x="275" y="48" width="210" height="112" rx="12" />
  <text class="d-title" x="380" y="78" text-anchor="middle">clsx</text>
  <text class="d-text" x="380" y="112" text-anchor="middle">Koşulları birleştirir</text>
  <text class="d-muted" x="380" y="136" text-anchor="middle">p-2 ve p-6 hâlâ var</text>
  <rect class="d-success" x="530" y="48" width="210" height="112" rx="12" />
  <text class="d-title" x="635" y="78" text-anchor="middle">tailwind-merge</text>
  <text class="d-text" x="635" y="112" text-anchor="middle">Aynı grupta sonuncu kalır</text>
  <text class="d-code" x="635" y="136" text-anchor="middle">p-6</text>
  <path class="d-line-accent" d="M238 104 H266" marker-end="url(#merge-arrow)" />
  <path class="d-line-accent" d="M493 104 H521" marker-end="url(#merge-arrow)" />
  <text class="d-muted" x="380" y="198" text-anchor="middle">HTML class sırası CSS kural sırasını değiştirmez</text>
</svg>
