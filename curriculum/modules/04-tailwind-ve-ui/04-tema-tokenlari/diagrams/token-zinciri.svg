      <path class="d-arrowhead-accent" d="M0,0 L8,4 L0,8 z" />
    </marker>
  </defs>
  <rect class="d-accent" x="18" y="58" width="220" height="112" rx="12" />
  <text class="d-title" x="128" y="88" text-anchor="middle">Tasarım kararı</text>
  <text class="d-text" x="128" y="120" text-anchor="middle">marka rengi</text>
  <text class="d-muted" x="128" y="144" text-anchor="middle">tek anlam, tek ad</text>
  <rect class="d-violet" x="270" y="58" width="220" height="112" rx="12" />
  <text class="d-title" x="380" y="88" text-anchor="middle">CSS değişkeni</text>
  <text class="d-code" x="380" y="120" text-anchor="middle">--color-brand-700</text>
