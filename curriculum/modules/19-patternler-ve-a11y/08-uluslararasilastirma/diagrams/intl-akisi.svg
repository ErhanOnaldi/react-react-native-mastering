<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280">
  <title>Locale ile kullanıcıya gösterim akışı</title>
  <defs>
    <marker id="intl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="d-arrowhead-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="d-lane" x="20" y="26" width="720" height="226" rx="12"/>
  <text class="d-title" x="380" y="54" text-anchor="middle">Aynı kaynak değer, locale'e göre gösterilir</text>
  <rect class="d-box" x="48" y="91" width="180" height="92" rx="8"/>
  <text class="d-title" x="138" y="121" text-anchor="middle">Makine değeri</text>
  <text class="d-code" x="138" y="151" text-anchor="middle">1234.5 / Date</text>
  <rect class="d-accent" x="288" y="91" width="184" height="92" rx="8"/>
  <text class="d-title" x="380" y="121" text-anchor="middle">Locale + Intl</text>
  <text class="d-code" x="380" y="149" text-anchor="middle">tr-TR / NumberFormat</text>
  <rect class="d-success" x="532" y="91" width="180" height="92" rx="8"/>
  <text class="d-title" x="622" y="121" text-anchor="middle">Ekran metni</text>
  <text class="d-code" x="622" y="151" text-anchor="middle">₺1.234,50</text>
  <line class="d-line-accent" x1="232" y1="137" x2="284" y2="137" marker-end="url(#intl-arrow)"/>
  <line class="d-line-accent" x1="476" y1="137" x2="528" y2="137" marker-end="url(#intl-arrow)"/>
  <text class="d-muted" x="380" y="220" text-anchor="middle">Biçimlenmiş metin kaynağın yerine geçmez</text>
</svg>
