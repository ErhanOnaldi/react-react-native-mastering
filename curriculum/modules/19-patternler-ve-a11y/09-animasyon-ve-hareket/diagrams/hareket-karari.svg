<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310">
  <title>Hareket için tercih ve maliyet kararı</title>
  <defs>
    <marker id="motion-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="d-arrowhead-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="d-box" x="30" y="48" width="180" height="78" rx="8"/>
  <text class="d-title" x="120" y="78" text-anchor="middle">Arayüz değişikliği</text>
  <text class="d-muted" x="120" y="103" text-anchor="middle">animasyonsuz da anlaşılır</text>
  <rect class="d-warning" x="286" y="48" width="190" height="78" rx="8"/>
  <text class="d-title" x="381" y="78" text-anchor="middle">Hareket tercihi</text>
  <text class="d-code" x="381" y="103" text-anchor="middle">reduce / no-preference</text>
  <rect class="d-success" x="550" y="28" width="180" height="82" rx="8"/>
  <text class="d-title" x="640" y="59" text-anchor="middle">Hareketi sadeleştir</text>
  <text class="d-muted" x="640" y="84" text-anchor="middle">CSS veya davranış</text>
  <rect class="d-accent" x="550" y="172" width="180" height="82" rx="8"/>
  <text class="d-title" x="640" y="203" text-anchor="middle">Özelliği ölç</text>
  <text class="d-code" x="640" y="228" text-anchor="middle">transform / opacity</text>
  <line class="d-line-accent" x1="212" y1="87" x2="282" y2="87" marker-end="url(#motion-arrow)"/>
  <path class="d-line-accent" d="M478 72 H520 V69 H546" marker-end="url(#motion-arrow)"/>
  <path class="d-line-accent" d="M478 104 H520 V213 H546" marker-end="url(#motion-arrow)"/>
  <text class="d-text-danger" x="380" y="286" text-anchor="middle">Animasyon sunum katmanıdır; güncellemenin şartı olmaz</text>
</svg>
