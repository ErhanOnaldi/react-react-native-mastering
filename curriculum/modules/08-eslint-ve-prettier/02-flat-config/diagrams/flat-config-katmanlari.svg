<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 325">
  <title>Flat config katmanları dosya kümelerine uygulanır</title>
  <defs>
    <marker id="ok-config-layer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="d-lane" x="25" y="30" width="225" height="270" rx="10"/>
  <rect class="d-accent" x="42" y="55" width="191" height="104" rx="8"/>
  <text class="d-title" x="137" y="83" text-anchor="middle">JavaScript katmanı</text>
  <text class="d-code" x="137" y="111" text-anchor="middle">@eslint/js</text>
  <text class="d-muted" x="137" y="137" text-anchor="middle">files: *.js, *.mjs</text>
  <line class="d-line" x1="137" y1="165" x2="137" y2="204" marker-end="url(#ok-config-layer)"/>
  <rect class="d-box" x="42" y="215" width="191" height="59" rx="8"/>
  <text class="d-code" x="137" y="241" text-anchor="middle">scripts/report.mjs</text>
  <text class="d-muted" x="137" y="262" text-anchor="middle">JS kuralları uygulanır</text>

  <rect class="d-lane" x="267" y="30" width="225" height="270" rx="10"/>
  <rect class="d-violet" x="284" y="55" width="191" height="104" rx="8"/>
  <text class="d-title" x="379" y="83" text-anchor="middle">TypeScript katmanı</text>
  <text class="d-code" x="379" y="111" text-anchor="middle">typescript-eslint</text>
  <text class="d-muted" x="379" y="137" text-anchor="middle">files: *.ts, *.tsx</text>
  <line class="d-line" x1="379" y1="165" x2="379" y2="204" marker-end="url(#ok-config-layer)"/>
  <rect class="d-box" x="284" y="215" width="191" height="59" rx="8"/>
  <text class="d-code" x="379" y="241" text-anchor="middle">src/data.ts · View.tsx</text>
  <text class="d-muted" x="379" y="262" text-anchor="middle">TS kuralları uygulanır</text>

  <rect class="d-lane" x="509" y="30" width="225" height="270" rx="10"/>
  <rect class="d-success" x="526" y="55" width="191" height="104" rx="8"/>
  <text class="d-title" x="621" y="83" text-anchor="middle">Son ortak katman</text>
  <text class="d-code" x="621" y="111" text-anchor="middle">Prettier uyumu</text>
  <text class="d-muted" x="621" y="137" text-anchor="middle">config dizisinin sonu</text>
  <line class="d-line" x1="621" y1="165" x2="621" y2="204" marker-end="url(#ok-config-layer)"/>
  <rect class="d-box" x="526" y="215" width="191" height="59" rx="8"/>
  <text class="d-code" x="621" y="241" text-anchor="middle">eşleşen kaynak dosyalar</text>
  <text class="d-muted" x="621" y="262" text-anchor="middle">biçim çakışmaları kapanır</text>
</svg>
