<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250">
  <title>Editör, pre-commit ve CI erken geri bildirim katmanlarıdır</title>
  <defs>
    <marker id="ok-quality-layer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrowhead-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="d-accent" x="30" y="50" width="195" height="120" rx="10"/>
  <text class="d-title" x="127" y="82" text-anchor="middle">Editör</text>
  <text class="d-text" x="127" y="112" text-anchor="middle">yazarken / kaydederken</text>
  <text class="d-code" x="127" y="143" text-anchor="middle">hızlı geri bildirim</text>

  <line class="d-line-accent" x1="231" y1="110" x2="270" y2="110" marker-end="url(#ok-quality-layer)"/>

  <rect class="d-warning" x="282" y="50" width="195" height="120" rx="10"/>
  <text class="d-title" x="379" y="82" text-anchor="middle">Pre-commit</text>
  <text class="d-text" x="379" y="112" text-anchor="middle">staged dosyalar</text>
  <text class="d-code" x="379" y="143" text-anchor="middle">commit öncesi kontrol</text>

  <line class="d-line-accent" x1="483" y1="110" x2="522" y2="110" marker-end="url(#ok-quality-layer)"/>

  <rect class="d-success" x="534" y="50" width="195" height="120" rx="10"/>
  <text class="d-title" x="631" y="82" text-anchor="middle">CI</text>
  <text class="d-text" x="631" y="112" text-anchor="middle">ortak repo kontrolü</text>
  <text class="d-code" x="631" y="143" text-anchor="middle">lint + format:check</text>

  <text class="d-muted" x="380" y="210" text-anchor="middle">Her katman aynı config'i kullanır; yerel katmanlar atlanabilir.</text>
</svg>
